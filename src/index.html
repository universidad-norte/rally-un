<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { 
      background-color: #f4f6f9; 
      padding: 12px; 
      font-size: 1.1rem; 
    }
    
    .card-custom { 
      border-radius: 16px; 
      box-shadow: 0 6px 15px rgba(0,0,0,0.12); 
      padding: 20px 15px;
    }

    .form-select-lg {
      font-size: 1.25rem !important;
      padding: 12px 15px !important;
      font-weight: bold;
      border: 2px solid #0d6efd;
      border-radius: 10px;
    }

    .btn-equipo { 
      font-size: 1.2rem !important; 
      font-weight: 800 !important; 
      padding: 18px 12px !important; 
      border: none;
      border-radius: 12px;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      line-height: 1.2;
    }

    /* Estilos para Selección de Emojis */
    .emoji-group {
      display: flex;
      justify-content: space-around;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 8px 5px;
      margin-top: 6px;
    }

    .emoji-btn {
      font-size: 1.8rem;
      cursor: pointer;
      opacity: 0.35;
      transition: transform 0.15s, opacity 0.15s;
      user-select: none;
    }

    .emoji-btn.active {
      opacity: 1;
      transform: scale(1.35);
    }

    .txt-ronda {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0d6efd;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container text-center px-1" style="max-width: 500px;">
    <h1 class="fw-bold my-3 text-primary" style="font-size: 1.8rem;">🏁 RALLY UNIVERSITARIO 🏁</h1>
    
    <div id="vista-captura" class="card card-custom">
      <h3 class="mb-3 fw-bold text-dark" style="font-size: 1.3rem;">Panel de Estación</h3>
      
      <div class="mb-3 text-start">
        <label for="selectEstacion" class="form-label fw-bold text-secondary">Selecciona tu Estación:</label>
        <select id="selectEstacion" class="form-select form-select-lg" onchange="confirmarYBloquearEstacion()">
          <option value="">Cargando estaciones...</option>
        </select>
        <div id="txtBloqueo" class="mt-2 text-danger fw-bold d-none fs-6">🔒 Estación asignada.</div>
      </div>

      <div id="areaEnfrentamiento" class="d-none">
        <hr class="my-3">
        <div class="txt-ronda mb-2" id="txtRonda">Ronda X</div>

        <!-- EVALUACIÓN DE ENERGÍA EQUIPO 1 -->
        <div class="text-start mb-3 p-2 bg-light rounded border">
          <label class="fw-bold small text-dark d-block">⚡ Entusiasmo/Energía <span id="nomEq1Label" class="text-primary"></span>:</label>
          <div class="emoji-group" id="groupEq1">
            <span class="emoji-btn" onclick="selEmoji('eq1', 1, this)">😡</span>
            <span class="emoji-btn" onclick="selEmoji('eq1', 2, this)">😠</span>
            <span class="emoji-btn active" onclick="selEmoji('eq1', 3, this)">😐</span>
            <span class="emoji-btn" onclick="selEmoji('eq1', 4, this)">😀</span>
            <span class="emoji-btn" onclick="selEmoji('eq1', 5, this)">🤩</span>
          </div>
        </div>

        <!-- EVALUACIÓN DE ENERGÍA EQUIPO 2 -->
        <div class="text-start mb-3 p-2 bg-light rounded border">
          <label class="fw-bold small text-dark d-block">⚡ Entusiasmo/Energía <span id="nomEq2Label" class="text-primary"></span>:</label>
          <div class="emoji-group" id="groupEq2">
            <span class="emoji-btn" onclick="selEmoji('eq2', 1, this)">😡</span>
            <span class="emoji-btn" onclick="selEmoji('eq2', 2, this)">😠</span>
            <span class="emoji-btn active" onclick="selEmoji('eq2', 3, this)">😐</span>
            <span class="emoji-btn" onclick="selEmoji('eq2', 4, this)">😀</span>
            <span class="emoji-btn" onclick="selEmoji('eq2', 5, this)">🤩</span>
          </div>
        </div>

        <p class="fw-bold text-dark mb-2">Selecciona al Ganador:</p>
        
        <div class="d-grid gap-2 my-2">
          <!-- Botón Equipo 1 -->
          <button id="btnEq1" class="btn btn-equipo" onclick="guardarGanador('EQ1')">Equipo 1</button>
          
          <!-- Botón Empate -->
          <button class="btn btn-warning btn-equipo text-dark fw-bold" onclick="guardarGanador('EMPATE')">
            🤝 EMPATE (1 PT C/U)
          </button>
          
          <!-- Botón Equipo 2 -->
          <button id="btnEq2" class="btn btn-equipo" onclick="guardarGanador('EQ2')">Equipo 2</button>
        </div>
      </div>

      <div id="msgStatus" class="mt-3 fw-bold text-primary fs-5"></div>
    </div>
  </div>

  <script>
    let dueloActual = null;
    let valEnergiaEq1 = 3; // Valor por defecto (😐)
    let valEnergiaEq2 = 3; // Valor por defecto (😐)

    document.addEventListener("DOMContentLoaded", function() {
      cargarOpcionesEstaciones();
    });

    function selEmoji(equipo, valor, elem) {
      const parent = elem.parentElement;
      const btns = parent.getElementsByClassName('emoji-btn');
      for (let btn of btns) {
        btn.classList.remove('active');
      }
      elem.classList.add('active');

      if (equipo === 'eq1') valEnergiaEq1 = valor;
      if (equipo === 'eq2') valEnergiaEq2 = valor;
    }

    // Función para reiniciar visualmente los emojis al Nivel 3 (😐)
    function resetEmojisUI() {
      valEnergiaEq1 = 3;
      valEnergiaEq2 = 3;

      ['groupEq1', 'groupEq2'].forEach(groupId => {
        const group = document.getElementById(groupId);
        if (group) {
          const btns = group.getElementsByClassName('emoji-btn');
          for (let i = 0; i < btns.length; i++) {
            btns[i].classList.remove('active');
            if (i === 2) { // El índice 2 corresponde a la 3ra opción (😐)
              btns[i].classList.add('active');
            }
          }
        }
      });
    }

    function cargarOpcionesEstaciones() {
      google.script.run.withSuccessHandler(function(estaciones) {
        const select = document.getElementById('selectEstacion');
        select.innerHTML = '<option value="">-- Seleccionar Estación --</option>';
        if (estaciones && estaciones.length > 0) {
          estaciones.forEach(function(est) {
            let option = document.createElement('option');
            option.value = est.id;
            option.text = est.nombre;
            select.appendChild(option);
          });
        }
      }).getListaEstaciones();
    }

    function confirmarYBloquearEstacion() {
      const select = document.getElementById('selectEstacion');
      if (!select.value) return;
      select.disabled = true;
      document.getElementById('txtBloqueo').classList.remove('d-none');
      cargarEnfrentamiento();
    }

    function cargarEnfrentamiento() {
      const numEstacion = document.getElementById('selectEstacion').value;
      if(!numEstacion) return;

      document.getElementById('msgStatus').innerText = "⏳ Cargando duelo...";
      document.getElementById('areaEnfrentamiento').classList.add('d-none');
      
      // Reiniciar selección de emojis visualmente y en variables
      resetEmojisUI();

      google.script.run.withSuccessHandler(function(data) {
        if(!data) {
          document.getElementById('areaEnfrentamiento').classList.add('d-none');
          document.getElementById('msgStatus').innerHTML = "🎉 <br>¡Todas las rondas de esta estación han finalizado!";
          return;
        }
        dueloActual = data;
        document.getElementById('txtRonda').innerText = "Ronda " + data.ronda;
        
        document.getElementById('nomEq1Label').innerText = data.equipo1.nombre;
        document.getElementById('nomEq2Label').innerText = data.equipo2.nombre;

        const btn1 = document.getElementById('btnEq1');
        btn1.innerText = "🏆 " + data.equipo1.nombre;
        btn1.style.backgroundColor = data.equipo1.color;
        
        const btn2 = document.getElementById('btnEq2');
        btn2.innerText = "🏆 " + data.equipo2.nombre;
        btn2.style.backgroundColor = data.equipo2.color;
        
        document.getElementById('areaEnfrentamiento').classList.remove('d-none');
        document.getElementById('msgStatus').innerText = "";
      }).getEnfrentamientoActual(numEstacion);
    }

    function guardarGanador(opcion) {
      if(!dueloActual) return;
      
      let ganadorSel = "";
      if(opcion === 'EQ1') ganadorSel = dueloActual.equipo1.clave;
      if(opcion === 'EQ2') ganadorSel = dueloActual.equipo2.clave;
      if(opcion === 'EMPATE') ganadorSel = "EMPATE";

      document.getElementById('areaEnfrentamiento').classList.add('d-none');
      document.getElementById('msgStatus').innerText = "💾 Guardando resultado y energía...";

      google.script.run.withSuccessHandler(function(res) {
        document.getElementById('msgStatus').innerText = "✅ ¡Resultado guardado!";
        cargarEnfrentamiento();
      }).registrarResultado(dueloActual.row, ganadorSel, dueloActual.equipo1.clave, dueloActual.equipo2.clave, valEnergiaEq1, valEnergiaEq2);
    }
  </script>
</body>
</html>
