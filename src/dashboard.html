<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* VARIABLES DE MODO OSCURO (POR DEFECTO) */
    :root {
      --bg-body: #0f172a;
      --text-main: #f8fafc;
      --card-bg: #1e293b;
      --card-border: #334155;
      --cell-border: #334155;
      --table-header-bg: #334155;
      --table-header-text: #ffffff;
      --status-fin-bg: rgba(16, 185, 129, 0.15);
      --status-fin-border: #10b981;
      --status-pen-bg: rgba(100, 116, 139, 0.1);
      --text-winner: #34d399;
      --text-vs: #94a3b8;
    }

    /* VARIABLES DE MODO CLARO */
    [data-theme="light"] {
      --bg-body: #f4f6f9;
      --text-main: #1e293b;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --cell-border: #e2e8f0;
      --table-header-bg: #1e293b;
      --table-header-text: #ffffff;
      --status-fin-bg: rgba(16, 185, 129, 0.12);
      --status-fin-border: #059669;
      --status-pen-bg: #f8fafc;
      --text-winner: #047857;
      --text-vs: #64748b;
    }

    body { 
      background-color: var(--bg-body); 
      color: var(--text-main);
      padding: 15px; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }
    
    .card-dark { 
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px; 
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .badge-color {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.2);
    }

    .celda-partido {
      font-size: 0.85rem;
      padding: 8px 6px !important;
      border: 1px solid var(--cell-border) !important;
      min-width: 140px;
      color: var(--text-main);
    }

    .status-finalizado {
      background-color: var(--status-fin-bg) !important;
      border-left: 4px solid var(--status-fin-border) !important;
    }

    .status-pendiente {
      background-color: var(--status-pen-bg) !important;
    }

    .txt-ganador {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-winner);
    }

    .txt-vs {
      color: var(--text-vs);
    }

    .table-custom-header {
      background-color: var(--table-header-bg) !important;
      color: var(--table-header-text) !important;
    }

    @media print {
      body { background-color: #ffffff !important; color: #000000 !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .card-dark { background-color: #ffffff !important; border: none !important; color: #000000 !important; }
      .table { border: 1px solid #000 !important; }
      .table th, .table td { border: 1px solid #000 !important; color: #000 !important; }
    }
  </style>
</head>
<body>
  <div class="container-fluid text-center">
    
    <!-- ENCABEZADO Y CONTROLES -->
    <div class="d-flex justify-content-between align-items-center my-3 no-print">
      <h2 class="fw-bold text-primary m-0">🏁 DASHBOARD GENERAL DEL RALLY 🏁</h2>
      <div class="d-flex gap-2">
        <!-- Botón para alternar tema -->
        <button id="btnTema" class="btn btn-outline-secondary fw-bold" onclick="toggleTema()">
          ☀️ Modo Claro
        </button>
        <!-- Botón de refrescar -->
        <button class="btn btn-primary fw-bold" onclick="cargarDashboard()">
          🔄 Actualizar
        </button>
        <!-- Botón de impresión -->
        <button class="btn btn-success fw-bold" onclick="window.print()">
          🖨️ Imprimir
        </button>
      </div>
    </div>

    <!-- TARJETAS DE MÉTRICAS / AVANCE -->
    <div class="row g-3 mb-4 no-print">
      <div class="col-md-3">
        <div class="card-dark text-center py-3">
          <div class="opacity-75 small">TOTAL DE ENCUENTROS</div>
          <div id="txtTotal" class="fs-2 fw-bold text-info">100</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-dark text-center py-3">
          <div class="opacity-75 small">COMPLETADOS</div>
          <div id="txtFinalizados" class="fs-2 fw-bold text-success">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-dark text-center py-3">
          <div class="opacity-75 small">PENDIENTES</div>
          <div id="txtPendientes" class="fs-2 fw-bold text-warning">100</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-dark text-center py-3">
          <div class="opacity-75 small">AVANCE GENERAL</div>
          <div id="txtPorcentaje" class="fs-2 fw-bold text-primary">0%</div>
        </div>
      </div>
    </div>

    <!-- TABLA MATRIZ DE ESTACIONES VS RONDAS -->
    <div class="card-dark">
      <div id="msgCargando" class="fw-bold opacity-75 my-4">⏳ Cargando matriz general de encuentros...</div>

      <div id="areaTabla" class="table-responsive d-none">
        <table class="table align-middle text-center m-0">
          <thead>
            <tr class="table-custom-header">
              <th style="width: 12%;">Estación / Actividad</th>
              <th style="width: 8.8%;">R1</th>
              <th style="width: 8.8%;">R2</th>
              <th style="width: 8.8%;">R3</th>
              <th style="width: 8.8%;">R4</th>
              <th style="width: 8.8%;">R5</th>
              <th style="width: 8.8%;">R6</th>
              <th style="width: 8.8%;">R7</th>
              <th style="width: 8.8%;">R8</th>
              <th style="width: 8.8%;">R9</th>
              <th style="width: 8.8%;">R10</th>
            </tr>
          </thead>
          <tbody id="tablaMatriz">
            <!-- Carga dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      cargarDashboard();
    });

    // Función para cambiar de Modo Oscuro a Modo Claro y viceversa
    function toggleTema() {
      const body = document.body;
      const btn = document.getElementById('btnTema');
      
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        btn.innerHTML = "☀️ Modo Claro";
        btn.className = "btn btn-outline-secondary fw-bold";
      } else {
        body.setAttribute('data-theme', 'light');
        btn.innerHTML = "🌙 Modo Oscuro";
        btn.className = "btn btn-outline-dark fw-bold";
      }
    }

    function cargarDashboard() {
      google.script.run.withSuccessHandler(function(res) {
        document.getElementById('txtTotal').innerText = res.resumen.total;
        document.getElementById('txtFinalizados').innerText = res.resumen.finalizados;
        document.getElementById('txtPendientes').innerText = res.resumen.pendientes;
        document.getElementById('txtPorcentaje').innerText = res.resumen.porcentaje + "%";

        const tbody = document.getElementById('tablaMatriz');
        tbody.innerHTML = "";

        for (let e = 1; e <= 10; e++) {
          let nombreActividad = res.mapaEstaciones[e] || '';
          let rowHtml = `<tr>
            <td class="text-start fw-bold table-custom-header">
              Estación ${e}<br><small class="opacity-75">${nombreActividad}</small>
            </td>`;

          for (let r = 1; r <= 10; r++) {
            let clave = `E${e}-R${r}`;
            let match = res.matriz[clave];

            if (match) {
              let claseEstatus = match.estatus === "FINALIZADO" ? "status-finalizado" : "status-pendiente";
              let textoGanador = match.estatus === "FINALIZADO" ? `<div class="txt-ganador">🏆 ${match.ganadorNombre}</div>` : '';

              rowHtml += `<td class="celda-partido ${claseEstatus}">
                <div>
                  <span class="badge-color" style="background-color: ${match.eq1Color};"></span>${match.eq1Nombre}
                </div>
                <div class="txt-vs small my-1">vs</div>
                <div>
                  <span class="badge-color" style="background-color: ${match.eq2Color};"></span>${match.eq2Nombre}
                </div>
                ${textoGanador}
              </td>`;
            } else {
              rowHtml += `<td class="celda-partido text-muted">-</td>`;
            }
          }

          rowHtml += `</tr>`;
          tbody.innerHTML += rowHtml;
        }

        document.getElementById('msgCargando').classList.add('d-none');
        document.getElementById('areaTabla').classList.remove('d-none');
      }).getDatosDashboard();
    }
  </script>
</body>
</html>
