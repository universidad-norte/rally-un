<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rally Universitario - Bienvenido</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd 0%, #002b66 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card-splash {
      background: rgba(255, 255, 255, 0.98);
      color: #333;
      border-radius: 20px;
      padding: 35px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 100%;
    }

    /* Estilo del Logo */
    .img-logo {
      max-width: 240px;
      max-height: 160px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .progress-bar {
      transition: width 1s linear;
    }
  </style>
</head>
<body>

  <div class="card-splash text-center">
    <!-- 🖼️ REEMPLAZA ESTA URL CON EL LINK DE LA IMAGEN / LOGO DE TU UNIVERSIDAD -->
    <img src="https://via.placeholder.com/240x140?text=Logo+Universidad" alt="Logo Universidad" class="img-logo">
    
    <h1 class="fw-bold mb-2 text-primary" style="font-size: 1.9rem;">RALLY UNIVERSITARIO</h1>
    <h3 class="fw-bold text-secondary mb-4" style="font-size: 1.2rem;">Bienvenido al Sistema de Captura</h3>

    <p class="fs-5 mb-2">Entrando al sistema en <strong id="contador" class="text-primary fs-3">5</strong> segundos...</p>

    <!-- Barra de tiempo visual (5 segundos) -->
    <div class="progress mb-3" style="height: 10px; border-radius: 5px;">
      <div id="barra" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 0%;"></div>
    </div>

    <!-- Botón por si el usuario no quiere esperar -->
    <a id="btnEntrar" href="#" class="btn btn-primary btn-lg w-100 fw-bold fs-5 py-2 mt-2">
      Ingresar Ahora ➔
    </a>
  </div>

  <script>
    const URL_GOOGLE_SCRIPT = "https://script.google.com/a/macros/un.edu.mx/s/AKfycbxm8-evC3BpUYOoSm-U6lo41KAHVfwVVYGrmj5Z-oTPCe04DCw-SmlMOSsnYZcwH-c/exec";

    // Asignar la URL al botón
    document.getElementById('btnEntrar').href = URL_GOOGLE_SCRIPT;

    let segundos = 5;
    const elContador = document.getElementById('contador');
    const elBarra = document.getElementById('barra');

    // Contador y Redirección Automática
    const intervalo = setInterval(function() {
      segundos--;
      elContador.innerText = segundos;
      elBarra.style.width = ((5 - segundos) * 20) + '%';

      if (segundos <= 0) {
        clearInterval(intervalo);
        window.location.href = URL_GOOGLE_SCRIPT;
      }
    }, 1000);
  </script>

</body>
</html>
